# Development environment override
services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: .cloud/docker/Dockerfile
      target: frontend-dev
    image: codeclarityce/frontend-dev:latest
    restart: always
    environment:
      - PNPM_STORE_DIR=/pnpm/store
    volumes:
      - ../../frontend:/app:rw
      # Container-managed node_modules. The repo root is a pnpm workspace, so a
      # host `pnpm install` re-links frontend/node_modules into the repo-root
      # .pnpm store (../../../node_modules/.pnpm) which doesn't exist inside
      # /app. This anonymous volume shadows the host node_modules so the
      # container does its own standalone install with valid local symlinks.
      - /app/node_modules
      - pnpm-store:/pnpm/store
      # Per-container pnpm settings (allowBuilds + minimumReleaseAge=0).
      # Kept OUT of frontend/ root so the host's workspace install isn't tricked
      # into treating frontend/ as a standalone sub-workspace.
      - ../../frontend/.cloud/docker/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 200M

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - ../../.cloud/env/.env.dev
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
        "--watch",
      ]
    restart: always
    volumes:
      - ../../frontend/.cloud/docker/conf/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/.cloud/docker/conf/certs:/etc/caddy/certs:ro
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      # HTTP/3
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

volumes:
  pnpm-store:
    external: true
