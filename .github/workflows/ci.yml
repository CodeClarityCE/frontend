# Node image CI from the central workflows; see CodeClarityCE/.github.
name: CI

on:
  pull_request:
    branches: [main, develop, "spec/**"]
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: CodeClarityCE/.github/.github/workflows/node-image.yml@v1
    # Release jobs only; they run on main when CI_RELEASE is true.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Docker Hub login for the release; GitHub passes secrets only when named here.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      # Vitest in run mode; plain test:unit would watch.
      test-command: pnpm test:unit:run
      # Mocked Playwright suite, default projects (chromium, pixel-5). Keep the image in step
      # with @playwright/test and .cloud/scripts/e2e-baselines.sh.
      e2e-image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # CI=true means one worker in the config; a runner has room for four.
      e2e-command: pnpm exec playwright test --workers=4

  # The required check, kept here because called jobs show as "node / <job>".
  # Fails if any needed job failed or was cancelled; skipped counts as success.
  # CodeQL on every PR and push; outside ci's needs, so findings never fail ci.
  codeql:
    uses: CodeClarityCE/.github/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      javascript: true

  ci:
    needs: [node]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

  # Tracks a failing ci on pushes to main and develop in one issue per branch; not the required check.
  report:
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.ci.result == 'success' || needs.ci.result == 'failure') }}
    uses: CodeClarityCE/.github/.github/workflows/ci-report.yml@v1
    permissions:
      issues: write
      actions: read
    with:
      ci-result: ${{ needs.ci.result }}
