# Self-scan: starts a CodeClarity analysis of this repo's branch.
name: CodeClarity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  codeclarity-action:
    name: CodeClarity Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    env:
      # PR head branch on pull requests, else the pushed branch.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Start Analysis
        id: codeclarity-action
        uses: CodeClarityCE/codeclarity-action@68247a41666df9e0a4cf4fc87cf851ea7d6cc7eb # v0.1.0
        env:
          # The action reads its credentials from these.
          EMAIL: ${{ secrets.CODECLARITY_EMAIL }} # zizmor: ignore[secrets-outside-env]
          PASSWORD: ${{ secrets.CODECLARITY_PASSWORD }} # zizmor: ignore[secrets-outside-env]
          DOMAIN: ${{ secrets.CODECLARITY_DOMAIN }} # zizmor: ignore[secrets-outside-env]
        with:
          branch: ${{ env.BRANCH }}
          serverUrl: ${{ github.server_url }}
          projectName: ${{ github.repository }}
          analyzerName: "JavaScript Analyzer"
          failOnCritical: false
          failOnHigh: false
          failOnMedium: false
          failOnLow: false
          failOnInfo: false

      - name: Print Output
        env:
          VULNERABILITIES: ${{ steps.codeclarity-action.outputs.vulnerabilities }}
        run: echo "$VULNERABILITIES"
