approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmMinimalAgeGate: 0

packageExtensions:
  "@floating-ui/vue@*":
    peerDependencies:
      vue: ^3.0.0
  "@vee-validate/zod@*":
    peerDependencies:
      vue: ^3.0.0
  "@vueuse/core@*":
    peerDependencies:
      vue: ^3.0.0
  "@vueuse/shared@*":
    peerDependencies:
      vue: ^3.0.0
  eslint-plugin-testing-library@*:
    peerDependencies:
      typescript: "*"
  vite-plugin-vue-devtools@*:
    peerDependencies:
      vue: ^3.0.0

yarnPath: .yarn/releases/yarn-4.15.0.cjs
