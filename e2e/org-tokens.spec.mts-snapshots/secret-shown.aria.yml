- main:
  - region "Organisation":
    - paragraph: Test Organization
    - text: "Your role: Owner"
    - paragraph: Test org
    - term: Members
    - definition: 1 member
    - term: Joined
    - definition: /Joined Jan \d+, \d+/
    - term: Owner
    - definition: Deleted user
  - heading "Organization tokens" [level=1]
  - paragraph: Secrets a pipeline uses to act in this organisation without a member's password.
  - region "New token":
    - heading "New token" [level=2]
    - paragraph: "ci-pipeline (analyze). Copy it now: it will not be shown again."
    - code: ccot_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    - button "Copy token command"
    - status
    - button "Done"
  - heading "Create a token" [level=2]
  - text: Name
  - textbox "Name":
    - /placeholder: ci-pipeline
  - text: Scope
  - combobox "Scope":
    - option "Read"
    - option "Analyze (includes read)" [selected]
  - text: Expires after
  - combobox "Expires after":
    - option /\d+ days/
    - option /\d+ days/ [selected]
    - option /\d+ days/
  - button "Create token"