- main:
  - article:
    - heading "Gestion des données personnelles" [level=1]
    - heading "Objet du traitement (finalité et base légale)" [level=2]
    - text: "La société CodeClarity, dispose d'un site internet proposant un service d'aide aux développeurs. Ce site permet de recevoir les inscriptions de nos clients et les données collectées à cette occasion sont enregistrées et traitées dans un fichier clients. Ce fichier permet de :"
    - list:
      - listitem: Gérer les commandes, le paiement et la livraison.
      - listitem:
        - text: "Mener des opérations de marketing (fidélisation, promotions) et adresser des publicités par courriel auprès de nos clients qui ne s'y sont pas opposés ou qui l'ont accepté :"
        - list:
          - listitem: Sur des produits analogues à ceux qu'ils ont commandés.
          - listitem: Sur d'autres produits proposés par la société. Par exemple, si un client achète un abonnement, une offre de support pourra lui être proposée.
    - heading "Bases légales des traitements" [level=2]
    - list:
      - listitem: "/Gestion des commandes : la base légale du traitement est l'exécution d'un contrat \\(Cf\\. article [\\d,.]+[bkmBKM]+\\) du Règlement européen sur la protection des données\\./"
      - listitem: "Envoi de sollicitations commerciales par courriel sur des produits analogues à ceux commandés par les clients : la base légale du traitement est l'intérêt légitime de la société (Cf. article 6.1.f) du Règlement européen sur la protection des données), à savoir promouvoir nos produits auprès de nos clients."
      - listitem: "/Envoi de sollicitations commerciales par courriel sur d'autres produits proposés par la société CodeClarity : la base légale du traitement est le consentement \\(Cf\\. article 6\\.1\\.a\\) du Règlement européen sur la protection des données\\), comme l'exige l'article L\\. \\d+-5 du code des postes et des communications électroniques\\./"
      - listitem: "/Tenue de la comptabilité impliquant la conservation des données pour une période de \\d+ ans : la base légale du traitement est l'obligation légale \\(Cf\\. article 6\\.1\\.c du Règlement européen sur la protection des données\\)\\./"
    - heading "Catégories de données" [level=2]
    - list:
      - listitem: "Identité : civilité, nom, prénom, adresse, adresse de livraison, numéro de téléphone, adresse électronique, date de naissance, code interne de traitement permettant l'identification du client, données relatives à l'enregistrement sur des listes d'opposition."
      - listitem: "Données relatives aux commandes : numéro de la transaction, détail des achats, montant des achats, données relatives au règlement des factures (règlements, impayés, remises), retour de produits."
      - listitem: "Données relatives aux moyens de paiement : numéro de carte bancaire, date de fin de validité de la carte bancaire, cryptogramme visuel (lequel est immédiatement effacé)."
      - listitem: "Données nécessaires à la réalisation des actions de fidélisation et de prospection : historique des achats."
    - heading "Destinataires des données" [level=2]
    - list:
      - listitem: Les services clients et facturation de la société CodeClarity sont destinataires de l'ensemble des catégories de données.
    - heading "Catégories de données" [level=2]
    - list:
      - listitem: "/Données nécessaires à la gestion des commandes et à la facturation : pendant toute la durée de la relation commerciale et dix \\(\\d+\\) ans au titre des obligations comptables\\./"
      - listitem: "Données nécessaires à la réalisation des actions de fidélisation et à la prospection : pendant toute la durée de la relation commerciale et trois (3) ans à compter du dernier achat."
      - listitem: "Données relatives aux moyens de paiement : ces données ne sont pas conservées par la société CodeClarity ; elles sont collectées lors de la transaction et sont immédiatement supprimées dès le règlement de l'achat."
      - listitem: "Données concernant les listes d'opposition à recevoir de la prospection : trois (3) ans."
    - heading "Vos droits" [level=2]
    - text: Si vous ne souhaitez plus recevoir de publicité de la part de la société CodeClarity (exercice du droit d'opposition ou retrait d'un consentement déjà donné), contactez-nous (prévoir ici un lien vers un formulaire d'exercice des droits informatique et libertés, faisant apparaître les différentes hypothèses détaillées ci-dessus). Vous pouvez accéder aux données vous concernant, les rectifier ou les faire effacer. Vous disposez également d'un droit à la portabilité et d'un droit à la limitation du traitement de vos données (Consultez le site cnil.fr pour plus d'informations sur vos droits). Pour exercer ces droits ou pour toute question sur le traitement de vos données dans ce dispositif, vous pouvez contacter notre DPO.
    - list:
      - listitem:
        - text: "Contacter notre DPO par voie électronique :"
        - link "dpo@codeclarity.io":
          - /url: mailto:dpo@codeclarity.io
    - button "Go back"