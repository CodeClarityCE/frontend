- main:
  - article:
    - heading "Terms of service" [level=1]
    - paragraph:
      - emphasis: "/Last updated: March \\d+, \\d+/"
    - paragraph: From everyone at CodeClarity, thank you for using our products! We build them to help you do your best work. There are millions of people using CodeClarity products every day. Because we don't know every one of our customers personally, we have to put in place some Terms of Service to help keep the ship afloat.
    - paragraph:
      - text: When we say “Company”, “we”, “our”, or “us” in this document, we are referring to
      - strong:
        - link "CodeClarity":
          - /url: https://www.codeclarity.io
      - text: .
    - paragraph: When we say “Services”, we mean our websites, including www.codeclarity.io, and platform.codeclarity.io, and any product created and maintained by CodeClarity.
    - paragraph: When we say “You” or “your”, we are referring to the people or organizations that own an account with one or more of our Services.
    - paragraph: We may update these Terms of Service ("Terms") in the future.
    - paragraph:
      - text: When you use our Services, now or in the future, you are agreeing to the latest Terms. There may be times where we do not exercise or enforce a right or provision of the Terms; however, that does not mean we are waiving that right or provision.
      - strong: These Terms do contain a limitation of our liability.
    - paragraph: If you violate any of the Terms, we may terminate your account. That's a broad statement and it means you need to place a lot of trust in us.
    - heading "Account Terms" [level=2]
    - list:
      - listitem: You are responsible for maintaining the security of your account and password and for ensuring that any of your users do the same. The Company cannot and will not be liable for any loss or damage from your failure to comply with this security obligation.
      - listitem: You are responsible for all content posted to and activity that occurs under your account, including content posted by and activity of any users in your account.
      - listitem: You must be a human. Accounts registered by “bots” or other automated methods are not permitted.
    - heading "Payment, Refunds, and Plan Changes" [level=2]
    - list:
      - listitem: "If you are using a free version of one of our Services, it is really free: we do not ask you for your credit card and — just like for customers who pay for our Services — we do not sell your data."
      - listitem: For paid Services that offer a free trial, we explain the length of trial when you sign up. After the trial period, you need to pay in advance to keep using the Service. If you do not pay, we will freeze your account and it will be inaccessible until you make payment. If your account has been frozen for a while, we will queue it up for auto-cancellation.
      - listitem: If you are upgrading from a free plan to a paid plan, we will charge your card immediately and your billing cycle starts on the day of upgrade. For other upgrades or downgrades in plan level, the new rate starts from the next billing cycle.
      - listitem: All fees are exclusive of all taxes, levies, or duties imposed by taxing authorities. Where required, we will collect those taxes on behalf of the taxing authority and remit those taxes to taxing authorities. Otherwise, you are responsible for payment of all taxes, levies, or duties.
    - heading "Cancellation and Termination" [level=2]
    - list:
      - listitem:
        - text: You are solely responsible for properly canceling your account. Within each of our Services, we provide a simple no-questions-asked cancellation link. You can find instructions for how to cancel your account in our Cancellation policy. An email or phone request to cancel your account is not automatically considered cancellation. If you need help canceling your account, you can always
        - strong:
          - link "contact our Support team":
            - /url: mailto:contact@codeclarity.io
        - text: .
      - listitem: /All of your content will be inaccessible from the Services immediately upon account cancellation\. Within \d+ days, all content will be permanently deleted from active systems and logs\. Within \d+ days, all content will be permanently deleted from our backups\. We cannot recover this information once it has been permanently deleted\./
      - listitem: If you cancel the Service before the end of your current paid up month, your cancellation will take effect immediately, and you will not be charged again. We do not automatically prorate unused time in the last billing cycle.
      - listitem: We have the right to suspend or terminate your account and refuse any and all current or future use of our Services for any reason at any time. Suspension means you and any other users on your account will not be able to access the account or any content in the account. Termination will furthermore result in the deletion of your account or your access to your account, and the forfeiture and relinquishment of all content in your account. We also reserve the right to refuse the use of the Services to anyone for any reason at any time. We have this clause because statistically speaking, out of the hundreds of thousands of accounts on our Services, there is at least one doing something nefarious. There are some things we staunchly stand against and this clause is how we exercise that stance.
      - listitem: Verbal, physical, written or other abuse (including threats of abuse or retribution) of a Company employee or officer will result in immediate account termination.
    - heading "Modifications to the Service and Prices" [level=2]
    - list:
      - listitem: We make a promise to our customers to support our Services. That means when it comes to security, privacy, and customer support, we will continue to maintain any legacy Services. Sometimes it becomes technically impossible to continue a feature or we redesign a part of our Services because we think it could be better or we decide to close new signups of a product. We reserve the right at any time to modify or discontinue, temporarily or permanently, any part of our Services with or without notice.
      - listitem: /Sometimes we change the pricing structure for our products\. When we do that, we tend to exempt existing customers from those changes\. However, we may choose to change the prices for existing customers\. If we do so, we will give at least \d+ days notice and will notify you via the email address on record\. We may also post a notice about changes on our websites or the affected Services themselves\./
    - heading "Uptime, Security, and Privacy" [level=2]
    - list:
      - listitem: Your use of the Services is at your sole risk. We provide these Services on an “as is” and “as available” basis. We do not offer service-level agreements for most of our Services but do take uptime of our applications seriously.
      - listitem: We reserve the right to temporarily disable your account if your usage significantly exceeds the average usage of other customers of the Services. Of course, we'll reach out to the account owner before taking any action except in rare cases where the level of use may negatively impact the performance of the Service for other customers.
      - listitem: We take many measures to protect and secure your data through backups, redundancies, and encryption. We enforce encryption for data transmission from the public Internet. There are some edge cases where we may send your data through our network unencrypted.
      - listitem:
        - text: When you use our Services, you entrust us with your data. We take that trust to heart. You agree that CodeClarity may process your data as described in our
        - link "Privacy Policy":
          - /url: /privacy
        - text: "and for no other purpose. We as humans can access your data for the following reasons:"
    - list:
      - listitem:
        - strong: To help you with support requests you make.
        - text: We'll ask for express consent before accessing your account.
      - listitem:
        - strong: On the rare occasions when an error occurs that stops an automated process partway through.
        - text: We get automated alerts when such errors occur. When we can fix the issue and restart automated processing without looking at any personal data, we do. In rare cases, we have to look at a minimum amount of personal data to fix the issue. In these rare cases, we aim to fix the root cause to prevent the errors from recurring.
      - listitem:
        - strong: To safeguard CodeClarity.
        - text: We'll look at logs and metadata as part of our work to ensure the security of your data and the Services as a whole. If necessary, we may also access accounts as part of an abuse report investigation.
    - list:
      - listitem: We use third party vendors and hosting partners to provide the necessary hardware, software, networking, storage, and related technology required to run the Services.
      - listitem:
        - text: These Terms incorporate the
        - link "CodeClarity Data Processing Addendum (“DPA”)":
          - /url: /privacy
        - text: when the EU General Data Protection Regulation (“GDPR”) or United Kingdom General Data Protection Regulation (“UK GDPR”) applies to your use of CodeClarity Services to process Customer Data as defined in the DPA. The DPA linked above supersedes any previously agreed data processing addendum between you and CodeClarity relating to your use of the CodeClarity Services.
