      - listitem: We do not pre-screen content, but we reserve the right (but not the obligation) in our sole discretion to refuse or remove any content that is available via the Service.
      - listitem:
        - text: The Company or its licensors own all right, title, and interest in and to the Services, including all intellectual property rights therein, and you obtain no ownership rights in the Services as a result of your use. You may not duplicate, copy, or reuse any portion of the HTML, CSS, JavaScript, or visual design elements without express written permission from the Company. You must request permission to use the Company's logos or any Service logos for promotional purposes. Please
        - strong:
          - link "email us":
            - /url: mailto:contact@codeclarity.io
        - text: requests to use logos. We reserve the right to rescind any permissions if you violate these Terms.
      - listitem: You agree not to reproduce, duplicate, copy, sell, resell or exploit any portion of the Services, use of the Services, or access to the Services without the express written permission of the Company.
    - heading "Features and Bugs" [level=2]
    - paragraph: We design our Services with care, based on our own experience and the experiences of customers who share their time and feedback. However, there is no such thing as a service that pleases everybody. We make no guarantees that our Services will meet your specific requirements or expectations.
    - paragraph: We also test all of our features extensively before shipping them. As with any software, our Services inevitably have some bugs. We track the bugs reported to us and work through priority ones, especially any related to security or privacy. Not all reported bugs will get fixed and we don't guarantee completely error-free Services.
    - heading "Services Adaptations and API Terms" [level=2]
    - paragraph: "We offer Application Program Interfaces (“API”s) for some of our Services (currently CodeClarity). Any use of the API, including through a third-party product that accesses the Services, is bound by these Terms plus the following specific terms:"
    - list:
      - listitem: You expressly understand and agree that we are not liable for any damages or losses resulting from your use of the API or third-party products that access data via the API.
      - listitem:
        - text: Third parties may not access and employ the API if the functionality is part of an application that remotely records, monitors, or reports a Service user's activity
        - emphasis: other than time tracking
        - text: ", both inside and outside the applications. The Company, in its sole discretion, will determine if an integration service violates this bylaw. A third party that has built and deployed an integration for the purpose of remote user surveillance will be required to remove that integration."
      - listitem: Abuse or excessively frequent requests to the Services via the API may result in the temporary or permanent suspension of your account's access to the API. The Company, in its sole discretion, will determine abuse or excessive usage of the API. If we need to suspend your account's access, we will attempt to warn the account owner first. If your API usage could or has caused downtime, we may cut off access without prior notice.
