- main:
  - heading "Results" [level=1]
  - paragraph: /journey-\d+/
  - tablist "Results":
    - tab "SBOM"
    - tab "Vulnerabilities" [selected]
    - tab "Licenses"
  - tabpanel "Vulnerabilities":
    - alert:
      - heading "Knowledge sources have not been updated yet" [level=5]
      - paragraph: These results may be incomplete. This is expected on a new installation until the first update completes. This notice shows the status of each source when this analysis ran.
      - list:
        - listitem: "CWE: No update has been recorded yet."
        - listitem: "EPSS: No update has been recorded yet."
        - listitem: "FriendsOfPHP: No update has been recorded yet."
        - listitem: "GCVE: No update has been recorded yet."
        - listitem: "CISA KEV: No update has been recorded yet."
        - listitem: "Licenses: No update has been recorded yet."
        - listitem: "/NVD: No update has been recorded yet\\.( Data is current to \\w+ \\d+, \\d+\\.)?$/"
        - listitem: "OSV: No update has been recorded yet."
    - region "Summary":
      - heading "Summary" [level=2]
      - text: Language JavaScript Workspace Root
      - list "Vulnerability numbers":
        - listitem: Vulnerabilities 1 +1 since the last scan
        - listitem: Critical and high 0 Fix these first
        - listitem: Vulnerable dependencies 1 +1 since the last scan
        - listitem: Security grade A+ Excellent security posture
        - listitem: /Mean severity 5\.3 CVSS, 0 to \d+/
        - listitem: /Max severity 5\.3 CVSS, 0 to \d+/
      - button "How the security grade is set"
      - heading "Vulnerabilities by severity" [level=3]
      - group "Vulnerabilities by severity":
        - 'img "Critical: 0 vulnerabilities"'
        - 'img "High: 0 vulnerabilities"'
        - 'img "Medium: 1 vulnerability"'
        - 'img "Low: 0 vulnerabilities"'
        - 'img "None: 0 vulnerabilities"'
      - group: Show table
      - heading "Security impact" [level=3]
      - paragraph: /Mean impact across vulnerabilities, 0 to \d+\./
      - term: Confidentiality
      - definition: "0.0"
      - term: Integrity
      - definition: "0.0"
      - term: Availability
      - definition: "0.5"
      - heading /OWASP Top \d+/ [level=3]
      - paragraph: /No vulnerabilities in an OWASP Top \d+ category\./
    - region "Vulnerabilities":
      - heading "Vulnerabilities" [level=2]
      - paragraph: Security vulnerabilities found in your project dependencies
      - button "Export source verdicts"
      - searchbox "Search vulnerabilities"
      - button "Filters"
      - combobox "Sort by": Severity, highest first
      - tablist "View":
        - tab "List" [selected]
        - tab "Table"
      - paragraph: 1 vulnerability
      - tabpanel "List":
        - list "Vulnerabilities":
          - listitem:
            - article /CVE-\d+-\d+/:
              - text: Medium 5.3 CVSS 3.1
              - heading /CVE-\d+-\d+/ [level=3]:
                - link /CVE-\d+-\d+/:
                  - /url: /\/results\/vulnerabilities_details\?analysis_id=[0-9a-f-]+&project_id=[0-9a-f-]+&finding_id=CVE-2017-20162&workspace=\.&dependency=ms&version=0\.7\.1/
              - list "Affected dependencies":
                - listitem:
                  - link "ms@0.7.1":
                    - /url: /\/results\/vulnerabilities_details\?analysis_id=[0-9a-f-]+&project_id=[0-9a-f-]+&finding_id=CVE-2017-20162&workspace=\.&dependency=ms&version=0\.7\.1/
              - button "Create Ticket"
              - button "Add to Policy"
              - paragraph: Vercel ms Inefficient Regular Expression Complexity vulnerability. The parse function of vercel ms up to 1.x has an inefficient regular expression. Upgrading...
              - list "Warnings":
                - listitem: Uncorroborated
              - button "Show more"