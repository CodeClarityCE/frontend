- main:
  - heading "Results" [level=1]
  - paragraph: web-frontend
  - tablist "Results":
    - tab "SBOM"
    - tab "Patches" [selected]
    - tab "Licenses"
    - tab "CodeQL"
  - tabpanel "Patches":
    - region "Patches":
      - heading "Patches" [level=2]
      - text: Language JavaScript Workspace Root
      - list "Patch numbers":
        - listitem: Issues after patching 0 0 before patching
        - listitem: Vulnerabilities after patching 0 0 before patching
        - listitem: Vulnerable dependencies after patching 0 0 before patching
      - heading "Vulnerabilities by severity, before and after patching" [level=3]
      - list:
        - listitem: Before patching
        - listitem: After patching
      - group "Vulnerabilities by severity, before and after patching":
        - 'img "Critical: 0 before patching, 0 after"'
        - 'img "High: 0 before patching, 0 after"'
        - 'img "Medium: 0 before patching, 0 after"'
        - 'img "Low: 0 before patching, 0 after"'
        - 'img "None: 0 before patching, 0 after"'
      - group: Show table
      - heading "Security impact" [level=3]
      - paragraph: /Overall impact, 0 to \d+, before and after patching\./
      - term: Confidentiality
      - definition: 0.0 to 0.0
      - term: Integrity
      - definition: 0.0 to 0.0
      - term: Availability
      - definition: 0.0 to 0.0
      - region "Patches by direct dependency":
        - heading "Patches by direct dependency" [level=3]
        - searchbox "Search patches"
        - table "Patches":
          - caption: Patches
          - rowgroup:
            - row "Direct dependency Scope Status Vulnerabilities Fixed Upgrade to Details":
              - columnheader "Direct dependency":
                - button "Direct dependency"
              - columnheader "Scope":
                - button "Scope"
              - columnheader "Status":
                - button "Status"
              - columnheader "Vulnerabilities":
                - button "Vulnerabilities"
              - columnheader "Fixed":
                - button "Fixed"
              - columnheader "Upgrade to"
              - columnheader "Details"
          - rowgroup:
            - row "No vulnerable direct dependencies.":
              - cell "No vulnerable direct dependencies."
      - heading "Patched manifest" [level=3]
      - paragraph:
        - text: The upgrades applied to
        - code: package.json
        - text: .
      - heading "Dependencies" [level=4]
      - list:
        - listitem: /express \^\d+\.\d+\.2 Not vulnerable/
        - listitem: ms ^2.1.3 Not vulnerable
      - list:
        - listitem:
          - text: Update these dependency entries in
          - code: package.json
          - text: .
          - button "Copy the dependency entries"
        - listitem:
          - text: Reinstall to update the lockfile.
          - code: rm package-lock.json ; npm install . --prefer-online
          - button "Copy the command"