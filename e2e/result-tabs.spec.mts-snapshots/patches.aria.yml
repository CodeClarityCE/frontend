- main:
  - heading "Results" [level=1]
  - paragraph: web-frontend
  - tablist "Results":
    - tab "SBOM"
    - tab "Patches" [selected]
    - tab "Licenses"
    - tab "CodeQL"
  - tabpanel "Patches":
    - region "Patches":
      - heading "Patches" [level=2]
      - text: Language JavaScript Workspace Root
      - list "Patch numbers":
        - listitem: Issues after patching 2 4 before patching
        - listitem: Vulnerabilities after patching 2 4 before patching
        - listitem: Vulnerable dependencies after patching 2 3 before patching
      - heading "Vulnerabilities by severity, before and after patching" [level=3]
      - list:
        - listitem: Before patching
        - listitem: After patching
      - group "Vulnerabilities by severity, before and after patching":
        - 'img "Critical: 1 before patching, 0 after"'
        - 'img "High: 2 before patching, 1 after"'
        - 'img "Medium: 1 before patching, 1 after"'
        - 'img "Low: 0 before patching, 0 after"'
        - 'img "None: 0 before patching, 0 after"'
      - group: Show table
      - heading "Security impact" [level=3]
      - paragraph: /Overall impact, 0 to \d+, before and after patching\./
      - term: Confidentiality
      - definition: 6.2 to 3.1
      - term: Integrity
      - definition: 4.0 to 2.0
      - term: Availability
      - definition: 1.5 to 0.5
      - region "Patches by direct dependency":
        - heading "Patches by direct dependency" [level=3]
        - searchbox "Search patches"
        - table "Patches":
          - caption: Patches
          - rowgroup:
            - row "Direct dependency Scope Status Vulnerabilities Fixed Upgrade to Details":
              - columnheader "Direct dependency":
                - button "Direct dependency"
              - columnheader "Scope":
                - button "Scope"
              - columnheader "Status":
                - button "Status"
              - columnheader "Vulnerabilities":
                - button "Vulnerabilities"
              - columnheader "Fixed":
                - button "Fixed"
              - columnheader "Upgrade to"
              - columnheader "Details"
          - rowgroup:
            - row /express@\d+\.\d+\.2 Production Full patch 2 2 \d+\.\d+\.2 Details of express@\d+\.\d+\.2/:
              - cell /express@\d+\.\d+\.2/:
                - code: /express@\d+\.\d+\.2/
              - cell "Production"
              - cell "Full patch"
              - cell "2"
              - cell "2"
              - cell /\d+\.\d+\.2/:
                - code: /\d+\.\d+\.2/
              - cell /Details of express@\d+\.\d+\.2/:
                - button /Details of express@\d+\.\d+\.2/
            - row /request@\d+\.\d+\.2 Production No patch 1 0 No fixed version Details of request@\d+\.\d+\.2/:
              - cell /request@\d+\.\d+\.2/:
                - code: /request@\d+\.\d+\.2/
              - cell "Production"
              - cell "No patch"
              - cell "1"
              - cell "0"
              - cell "No fixed version"
              - cell /Details of request@\d+\.\d+\.2/:
                - button /Details of request@\d+\.\d+\.2/
            - row "vitest@3.2.0 Development Partial patch 2 1 3.2.4 Details of vitest@3.2.0":
              - cell "vitest@3.2.0":
                - code: vitest@3.2.0
              - cell "Development"
              - cell "Partial patch"
              - cell "2"
              - cell "1"
              - cell "3.2.4":
                - code: 3.2.4
              - cell "Details of vitest@3.2.0":
                - button "Details of vitest@3.2.0"
      - heading "Patched manifest" [level=3]
      - paragraph:
        - text: The upgrades applied to
        - code: package.json
        - text: .
      - heading "Dependencies" [level=4]
      - list:
        - listitem: /express \^\d+\.\d+\.2 to \^\d+\.\d+\.2 Full patch/
        - listitem: /request \^\d+\.\d+\.2 No patch/
        - listitem: ms ^2.1.3 Not vulnerable
      - list:
        - listitem:
          - text: Update these dependency entries in
          - code: package.json
          - text: .
          - button "Copy the dependency entries"
        - listitem:
          - text: Reinstall to update the lockfile.
          - code: rm package-lock.json ; npm install . --prefer-online
          - button "Copy the command"