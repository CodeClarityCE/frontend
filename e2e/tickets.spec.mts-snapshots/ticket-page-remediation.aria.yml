            - code: /npm diff --diff=js-yaml@\d+\.\d+\.1 --diff=js-yaml@\d+\.\d+\.0/
            - button "Copy registry diff command"
            - status
          - listitem:
            - paragraph: js-yaml 4.1.0 fixed in 4.3.0 Dev only
            - group: Installed via 2 paths
            - list:
