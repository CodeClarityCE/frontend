<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Start to adapt -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeClarity" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Applies the Theme before first paint; src/utils/theme.ts takes over and must agree.
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#111111" : "#ffffff");
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#1dce79" />
    <!-- End to adapt -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeClarity</title>
  </head>

  <body>
    <script type="module" src="/src/main.ts"></script>
    <div id="app"></div>
  </body>
</html>
