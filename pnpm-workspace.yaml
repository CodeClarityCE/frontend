# This file is for STANDALONE installs inside the frontend dev container only.
# When the host devcontainer runs `pnpm install` from the repo root, the
# root pnpm-workspace.yaml takes precedence and this file is ignored.
#
# Inside the container, /app is bind-mounted to host's frontend/ — pnpm walks
# up from /app, finds this file (no parent pnpm-workspace.yaml exists
# inside the container), and treats /app as the project root with the
# settings below.

# Override pnpm 11's default 24h gate. The container's standalone install
# may resolve fresh packages from the registry that haven't aged out yet.
minimumReleaseAge: 0

# Mirror the root workspace's allowBuilds verdicts so lifecycle scripts
# (esbuild downloads, @parcel/watcher native build, etc.) match host behavior.
allowBuilds:
  bcrypt: true
  "@swc/core": true
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
  msw: true
  vue-demi: true
  "@nestjs/core": false
  "@percy/core": false
  "@scarf/scarf": false
